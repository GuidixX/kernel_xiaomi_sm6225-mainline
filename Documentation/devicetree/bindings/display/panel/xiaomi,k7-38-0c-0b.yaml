%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/xiaomi,k7-38-0c-0b.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xiaomi K7 38 0c 0b AMOLED DSI panel

maintainers:
  - Guidix <guidixm@gmail.com>

description:
  Samsung S6E3FC-based 1080x2400 AMOLED panel used by Xiaomi Redmi Note 11
  and Redmi Note 11 NFC. The panel uses four DSI lanes and DSC compression.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: xiaomi,k7-38-0c-0b

  reg:
    maxItems: 1

  vddio-supply: true

  reset-gpios:
    maxItems: 1

  enable-gpios:
    maxItems: 1

required:
  - compatible
  - reg
  - vddio-supply
  - reset-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "xiaomi,k7-38-0c-0b";
            reg = <0>;
            vddio-supply = <&pm6125_l9>;
            reset-gpios = <&tlmm 82 GPIO_ACTIVE_LOW>;
            enable-gpios = <&pm6125_gpios 9 GPIO_ACTIVE_HIGH>;

            port {
                endpoint {
                    remote-endpoint = <&dsi_out>;
                };
            };
        };
    };
